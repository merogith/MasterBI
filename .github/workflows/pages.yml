# Build the static sample gallery and publish it to GitHub Pages.
#
# The site is generated, never committed: a run produces ~22 MB of dashboards,
# PDFs, decks and workbooks, and committing regenerable binaries would bloat
# the history permanently for no benefit.
#
# This also runs the full pipeline on Linux, so a failure here is a real
# portability signal — kaleido's static chart export in particular is the part
# most likely to behave differently off Windows.

name: Deploy sample gallery to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The demo and the local app are the same front end, built twice: this
      # target differs only in its base, because the site is served from a
      # repository sub-path rather than a domain root.
      - name: Build the front end for the sub-path
        run: |
          npm --prefix web ci
          npm --prefix web run build:pages

      - name: Build the static site
        run: python -m tools.build_pages --out site

      - name: Check the build produced what the front end expects
        run: |
          set -e
          for f in index.html 404.html static_shim.js \
                   data/samples.json data/survey.json data/runs.json \
                   data/catalog/options.json data/catalog/kpis.json \
                   data/ai/status.json; do
            test -s "site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # A deep link is served by 404.html, so it has to be the app shell —
          # not a stub, and not GitHub's own page.
          grep -q 'type="module"' site/404.html \
            || { echo "404.html is not the app shell — deep links will not work"; exit 1; }
          ls site/assets/*.js >/dev/null 2>&1 \
            || { echo "no bundle in site/assets"; exit 1; }
          # .nojekyll is deliberately zero bytes — its existence is the signal,
          # so -f rather than -s.
          test -f site/.nojekyll || { echo "missing: .nojekyll"; exit 1; }
          for id in northwind_saas meridian_early atlas_enterprise kestrel_retail; do
            test -s "site/data/runs/$id/summary.json" || { echo "no summary: $id"; exit 1; }
            test -s "site/data/runs/$id/tables.json"  || { echo "no tables: $id";  exit 1; }
            # Without this the Studio 404s for every visitor.
            test -s "site/data/runs/$id/spec.json"    || { echo "no spec: $id";    exit 1; }
            # The chart export is the fragile step; assert it actually ran.
            test -s "site/files/$id/dashboard.html"   || { echo "no dashboard: $id"; exit 1; }
            test -s "site/files/$id/report.pdf"       || { echo "no pdf: $id";       exit 1; }
            count=$(ls site/files/$id/charts/*.png 2>/dev/null | wc -l)
            test "$count" -gt 0 || { echo "no chart PNGs for $id — kaleido failed"; exit 1; }
          done
          echo "OK — $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"

      # Everything above checks that files exist. Three times running, the site
      # they describe was still broken in a browser — a base stamped in as a
      # path where a URL was needed, artifact links joined wrong, a shim guard
      # reading a global that no longer exists. So open it.
      - name: Install the browser check
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Drive the built site
        run: python -m pytest tests/test_pages_site.py -q -p no:cacheprovider

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
