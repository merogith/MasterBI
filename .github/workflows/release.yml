# Tag -> three executables -> a GitHub Release.
#
# The point of this is the first-run wall. `start.bat` builds a virtualenv and
# pip-installs on whatever network the user is on — which is a five-minute wait
# at best and a TLS-interception failure at worst, before they have seen
# anything. A downloaded file that opens a browser has neither problem.
#
#     git tag v0.3.0 && git push origin v0.3.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MasterBI-linux-x86_64
            binary: dist/MasterBI
          - os: macos-latest
            artifact: MasterBI-macos-arm64
            binary: dist/MasterBI
          - os: windows-latest
            artifact: MasterBI-windows-x86_64.exe
            binary: dist/MasterBI.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # The bundle carries `kpi_maker/ui_dist/`; without this it would ship the
      # server's own "no front end" 500 as the product.
      - name: Build the front end
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Freeze
        run: python -m installer.build

      # The check that matters, and the one a build succeeding does not give
      # you. kaleido is a native subprocess that already needs a non-ASCII path
      # workaround on Windows; whether it survives freezing is not something to
      # find out from a user. A run that produces no PNGs has "succeeded" with
      # every chart missing from the PDF and the deck.
      - name: The frozen app produces a real board pack
        shell: bash
        run: python installer/smoke.py "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the executables to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
          fail_on_unmatched_files: true
