# Render blueprint — https://render.com/docs/blueprint-spec
#
# What this does: Render watches the `main` branch of this repo. Every push
# rebuilds and redeploys automatically. No manual upload step.
#
# Setup (one time, in Render's web UI — cannot be scripted):
#   1. render.com -> sign in with GitHub
#   2. New -> Blueprint -> pick merogith/MasterBI
#   3. Apply. First build takes ~5 minutes (pandas/numpy wheels).
#
# Free-tier caveats, both fine for testing:
#   - The service sleeps after 15 min with no traffic; next request takes
#     ~30s to wake it. Upgrade to Starter ($7/mo) to remove this.
#   - Disk is ephemeral. Runs are wiped on every deploy and on wake from
#     sleep, so past runs disappear. The app regenerates them on demand, so
#     nothing breaks — but don't treat a hosted run as durable storage. The
#     container writes them to MASTERBI_RUNS_DIR, off the read-only source tree.

services:
  - type: web
    name: masterbi
    # Docker rather than the native Python runtime, because the app has a
    # compiled front end. `web/` builds to `kpi_maker/ui_dist/`, which is a
    # build artifact and not committed — a `pip install` build shipped a server
    # with nothing to serve, answering 500 at `/`. A native runtime cannot fix
    # that without assuming Node is present in an image nobody controls, so the
    # Dockerfile states the requirement in two stages instead. CI builds the
    # same file on every push, so this path is exercised rather than trusted.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    envVars:
      # Unbuffered stdout, so print() shows up in Render's live log tail.
      - key: PYTHONUNBUFFERED
        value: "1"
